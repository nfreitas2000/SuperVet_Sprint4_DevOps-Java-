# Variáveis simuladas para evitar PlaceholderResolutionException
DB_URL=jdbc:h2:mem:testdb;MODE=MSSQLServer
DB_USER=sa
DB_PASSWORD=

# Configuração do banco em memória (H2)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Desliga o Flyway nos testes e deixa o Hibernate montar as tabelas provisórias
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop