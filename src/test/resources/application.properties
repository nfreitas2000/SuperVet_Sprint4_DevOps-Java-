# Configuracao EXCLUSIVA dos testes: H2 em memoria, com valores fixos.
#
# IMPORTANTE: nao use ${DB_URL}, ${DB_USER} ou ${DB_PASSWORD} aqui. Variavel de
# ambiente tem prioridade sobre este arquivo, e no pipeline DB_URL aponta para o
# Azure SQL (jdbc:sqlserver://...), que o driver do H2 recusa.
spring.datasource.url=jdbc:h2:mem:clyvovet-test;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Os testes dependem dos dados de demonstracao (V4: carla@clyvovet.com, Thor...),
# entao o Flyway precisa rodar. O schema vem das migrations, nao do Hibernate.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
