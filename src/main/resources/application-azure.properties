# Perfil "azure": Azure SQL Database (PaaS).
# Os valores vem de variaveis de ambiente (App Settings do Web App), que o
# pipeline preenche a partir do Variable Group. Sem valor padrao de proposito:
# se faltar alguma, a aplicacao falha na hora em vez de subir com outro banco.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
