trigger:
- master

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: SuperVet-Secrets-BD

stages:
- stage: CI
  displayName: 'Integracao Continua (Build e Testes)'
  jobs:
  - job: Build
    steps:
    - task: Gradle@3
      displayName: 'Executar Build e Testes'
      inputs:
        gradleWrapperFile: 'gradlew'
        tasks: 'build'
        publishJUnitResults: true
        testResultsFiles: '**/TEST-*.xml'
      env:
        DB_URL: $(DB_URL)
        DB_USER: $(DB_USER)
        DB_PASSWORD: $(DB_PASSWORD)

    - task: CopyFiles@2
      displayName: 'Copiar Artefato (.jar)'
      inputs:
        SourceFolder: '$(System.DefaultWorkingDirectory)/build/libs'
        Contents: '*SNAPSHOT.jar'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      displayName: 'Publicar Artefato no DevOps'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: CD
  displayName: 'Entrega Continua (Deploy Automático)'
  dependsOn: CI
  condition: succeeded()
  jobs:
  - job: Deploy
    steps:
    - task: DownloadBuildArtifacts@0
      displayName: 'Baixar Artefato'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: AzureWebApp@1
      displayName: 'Deploy no Azure Web App'
      inputs:
        azureSubscription: 'Conexao-Azure-ClyvoVet'
        appType: 'webAppLinux'
        appName: 'clyvovet-app-24474'
        package: '$(System.ArtifactsDirectory)/**/*.jar'
        appSettings: '-DB_URL "$(DB_URL)" -DB_USER "$(DB_USER)" -DB_PASSWORD "$(DB_PASSWORD)"'
